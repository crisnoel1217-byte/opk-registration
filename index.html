<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CN OPK DASHBOARD</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}
body{background:#050816;color:white;overflow-x:hidden}

/* LAYOUT */
.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(15px);
  border-right:1px solid rgba(255,255,255,0.08);
  padding:20px;
}

.sidebar h2{
  font-size:20px;
  margin-bottom:20px;
}

.nav-btn{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
  border:none;
  background:rgba(255,255,255,0.06);
  color:white;
  cursor:pointer;
}

.nav-btn:hover{background:#22d3ee;color:black}

/* MAIN */
.main{
  flex:1;
  padding:20px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  padding:20px;
  border-radius:18px;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:none;
  background:#0b1020;
  color:white;
}

button{
  padding:10px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:700;
}

.primary{background:#22d3ee;color:black}
.danger{background:#ef4444;color:white}

.records{
  display:grid;
  gap:10px;
}

.record{
  padding:15px;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
  display:flex;
  justify-content:space-between;
}

.searchbar{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

.stats{
  display:flex;
  gap:10px;
}

.stat{
  flex:1;
  padding:15px;
  border-radius:12px;
  background:rgba(34,211,238,0.1);
}

@media(max-width:900px){
  .sidebar{display:none}
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>ANGELSTAR OPK BOOKING</h2>
  <button class="nav-btn">Dashboard</button>
  <button class="nav-btn">Bookings</button>
  <button class="nav-btn" onclick="exportExcel()">Export Excel</button>
  <button class="nav-btn danger" onclick="logout()">Logout</button>
</div>

<!-- MAIN -->
<div class="main">

<div class="header">
  <h1>Admin Dashboard</h1>
</div>

<div class="stats">
  <div class="stat">Total: <span id="total">0</span></div>
  <div class="stat">Today: <span id="today">0</span></div>
</div>

<div class="card">
  <div class="searchbar">
    <input id="search" placeholder="Search name / ID / agency">
    <button class="primary" onclick="filterData()">Search</button>
  </div>

  <div id="records" class="records"></div>
</div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyBJBT_BAeos1hb_fKJzSontJVgBub9Wjhc",
  authDomain: "opk-system-cn.firebaseapp.com",
  projectId: "opk-system-cn",
  storageBucket: "opk-system-cn.appspot.com",
  messagingSenderId: "1098097772017",
  appId: "1:1098097772017:web:4e015378c786d6b404f050"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let data = [];

const records = document.getElementById("records");
const total = document.getElementById("total");
const today = document.getElementById("today");

function load(){

  onSnapshot(collection(db,"bookings"),(snap)=>{

    data = [];
    records.innerHTML = "";

    snap.forEach(d=>{
      data.push({id:d.id,...d.data()});
    });

    render(data);

  });
}

function render(list){

  records.innerHTML = "";

  list.forEach(b=>{

    records.innerHTML += `
    <div class="record">
      <div>
        <b>${b.name}</b><br>
        ${b.bigoId}<br>
        ${b.agency}<br>
        ${b.slot} | ${b.date}
      </div>
      <button class="danger" onclick="del('${b.id}')">Delete</button>
    </div>
    `;
  });

  total.innerText = list.length;

  const t = new Date().toISOString().split("T")[0];
  today.innerText = list.filter(x=>x.date===t).length;
}

window.filterData = function(){

  const q = document.getElementById("search").value.toLowerCase();

  render(data.filter(x=>
    x.name?.toLowerCase().includes(q) ||
    x.bigoId?.toLowerCase().includes(q) ||
    x.agency?.toLowerCase().includes(q)
  ));
}

window.del = async function(id){
  await deleteDoc(doc(db,"bookings",id));
}

window.exportExcel = function(){

  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Bookings");
  XLSX.writeFile(wb,"CN_SAAS.xlsx");
}

window.logout = function(){
  signOut(auth);
}

onAuthStateChanged(auth,user=>{
  if(!user) alert("Admin only");
});

load();
</script>

</body>
</html>
