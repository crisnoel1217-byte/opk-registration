<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyBJBT_BAeos1hb_fKJzSontJVgBub9Wjhc",
  authDomain: "opk-system-cn.firebaseapp.com",
  projectId: "opk-system-cn",
  storageBucket: "opk-system-cn.appspot.com",
  messagingSenderId: "1098097772017",
  appId: "1:1098097772017:web:4e015378c786d6b404f050"
};

/* INIT */
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* ELEMENTS */
const slots = document.getElementById("slots");
const adminPanel = document.getElementById("adminPanel");
const records = document.getElementById("records");

const total = document.getElementById("total");
const today = document.getElementById("today");

const bookBtn = document.getElementById("bookBtn");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

const adminEmail = document.getElementById("adminEmail");
const adminPassword = document.getElementById("adminPassword");

let selectedTime = "";

/* GENERATE TIME SLOTS */
function generateSlots() {

  let slotsArray = [];

  let hour = 20;
  let minute = 0;

  while (hour < 22 || (hour === 22 && minute <= 15)) {

    const displayHour =
      hour > 12 ? hour - 12 : hour;

    const displayMinute =
      minute.toString().padStart(2, "0");

    const period =
      hour >= 12 ? "PM" : "AM";

    slotsArray.push(
      `${displayHour}:${displayMinute} ${period}`
    );

    minute += 15;

    if (minute >= 60) {
      minute = 0;
      hour++;
    }
  }

  return slotsArray;
}

/* RENDER SLOTS */
function renderSlots() {

  slots.innerHTML = "";

  generateSlots().forEach((time) => {

    const div = document.createElement("div");

    div.className = "slot-btn available";

    div.textContent = time;

    div.onclick = () => {

      document
        .querySelectorAll("#slots .slot-btn")
        .forEach((btn) => {
          btn.classList.remove("selected");
        });

      div.classList.add("selected");

      selectedTime = time;
    };

    slots.appendChild(div);
  });
}

/* BOOK FUNCTION */
async function book() {

  const name =
    document.getElementById("name").value.trim();

  const id =
    document.getElementById("id").value.trim();

  const lvl =
    document.getElementById("lvl").value.trim();

  const agency =
    document.getElementById("agency").value.trim();

  const gmail =
    document.getElementById("gmail").value.trim();

  const date =
    document.getElementById("date").value;

  if (
    !name ||
    !id ||
    !lvl ||
    !agency ||
    !gmail ||
    !date
  ) {
    alert("❌ Please complete all fields");
    return;
  }

  if (!selectedTime) {
    alert("❌ Please select a time slot");
    return;
  }

  try {

    /* CHECK DOUBLE BOOKING */
    const snap = await getDocs(
      collection(db, "bookings")
    );

    let alreadyBooked = false;

    snap.forEach((doc) => {

      const data = doc.data();

      if (
        data.date === date &&
        data.time === selectedTime
      ) {
        alreadyBooked = true;
      }
    });

    if (alreadyBooked) {
      alert("❌ Time slot already booked");
      return;
    }

    /* SAVE BOOKING */
    await addDoc(collection(db, "bookings"), {
      name,
      id,
      lvl,
      agency,
      gmail,
      date,
      time: selectedTime,
      createdAt: new Date()
    });

    alert("✅ Booking Successful");

    location.reload();

  } catch (error) {

    console.error(error);

    alert("❌ Booking Failed");
  }
}

/* ADMIN LOGIN */
async function login() {

  const email =
    adminEmail.value.trim();

  const password =
    adminPassword.value.trim();

  if (!email || !password) {
    alert("❌ Enter Email & Password");
    return;
  }

  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    alert("✅ Login Successful");

  } catch (error) {

    console.error(error);

    alert("❌ Login Failed");
  }
}

/* LOGOUT */
async function logout() {

  try {

    await signOut(auth);

    alert("✅ Logged Out");

  } catch (error) {

    console.error(error);
  }
}

/* BUTTON EVENTS */
bookBtn.addEventListener(
  "click",
  book
);

loginBtn.addEventListener(
  "click",
  login
);

logoutBtn.addEventListener(
  "click",
  logout
);

/* ADMIN STATE */
onAuthStateChanged(auth, async (user) => {

  if (user) {

    adminPanel.style.display = "block";

    records.innerHTML = "";

    const snap = await getDocs(
      collection(db, "bookings")
    );

    const todayDate =
      new Date()
      .toISOString()
      .split("T")[0];

    let todayCount = 0;

    snap.forEach((doc) => {

      const booking = doc.data();

      if (
        booking.date === todayDate
      ) {
        todayCount++;
      }

      records.innerHTML += `
        <div class="slot-btn">
          ${booking.name}
          <br>
          ${booking.time}
          <br>
          ${booking.date}
        </div>
      `;
    });

    total.innerText = snap.size;
    today.innerText = todayCount;

  } else {

    adminPanel.style.display = "none";
  }
});

/* START */
renderSlots();

</script>
