<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CN OPK SAAS ADMIN UPGRADED</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}
body{background:#050816;color:white;overflow-x:hidden}

/* LAYOUT */
.app{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{
  width:280px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(18px);
  border-right:1px solid rgba(255,255,255,0.08);
  padding:20px;
}

.brand{
  font-size:20px;
  font-weight:900;
  margin-bottom:25px;
  background:linear-gradient(90deg,#7c3aed,#22d3ee);
  -webkit-background-clip:text;
  color:transparent;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.nav button{
  padding:12px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:rgba(255,255,255,0.06);
  color:white;
  font-weight:600;
  transition:0.2s;
}

.nav button:hover{
  background:#22d3ee;
  color:black;
  transform:translateX(3px);
}

.danger{background:#ef4444 !important;color:white !important}

/* MAIN */
.main{flex:1;padding:25px}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.title{
  font-size:28px;
  font-weight:900;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  padding:18px;
  border-radius:18px;
  backdrop-filter:blur(10px);
}

.stat{
  font-size:28px;
  font-weight:900;
  margin-top:5px;
}

/* SEARCH */
.search{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

input{
  flex:1;
  padding:12px;
  border-radius:12px;
  border:none;
  background:#0b1020;
  color:white;
}

.search button{
  padding:12px 18px;
  border:none;
  border-radius:12px;
  background:#22d3ee;
  font-weight:800;
  cursor:pointer;
}

/* RECORDS */
.records{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.record{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  padding:15px;
  border-radius:15px;
  display:flex;
  justify-content:space-between;
}

.record button{
  background:#ef4444;
  border:none;
  padding:10px 14px;
  border-radius:12px;
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:900px){
  .sidebar{display:none}
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="brand">CN OPK SAAS</div>
  <div class="nav">
    <button onclick="showAll()">Dashboard</button>
    <button onclick="exportExcel()">Export Excel</button>
    <button onclick="clearAll()" class="danger">Clear All</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">

<div class="header">
  <div class="title">Admin Control Panel</div>
</div>

<!-- STATS -->
<div class="grid">
  <div class="card">Total Bookings<div class="stat" id="total">0</div></div>
  <div class="card">Today<div class="stat" id="today">0</div></div>
  <div class="card">Active Slots<div class="stat" id="slots">0</div></div>
</div>

<!-- SEARCH -->
<div class="card">
  <div class="search">
    <input id="search" placeholder="Search name / ID / agency">
    <button onclick="filterData()">Search</button>
  </div>

  <div class="records" id="records"></div>
</div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app = initializeApp({
   apiKey: "AIzaSyBJBT_BAeos1hb_fKJzSontJVgBub9Wjhc",
  authDomain: "opk-system-cn.firebaseapp.com",
  projectId: "opk-system-cn",
  storageBucket: "opk-system-cn.appspot.com",
  messagingSenderId: "1098097772017",
  appId: "1:1098097772017:web:4e015378c786d6b404f050"
});

const db = getFirestore(app);
const auth = getAuth(app);

let data=[];

const records=document.getElementById("records");

function load(){
  onSnapshot(collection(db,"bookings"),(snap)=>{
    data=[];
    records.innerHTML="";

    snap.forEach(d=>data.push({id:d.id,...d.data()}));

    render(data);
  });
}

function render(list){

  records.innerHTML="";

  list.forEach(b=>{
    records.innerHTML+=`
    <div class='record'>
      <div>
        <b>${b.name}</b><br>
        ${b.bigoId}<br>
        ${b.agency}<br>
        ${b.slot} | ${b.date}
      </div>
      <button onclick="del('${b.id}')">Delete</button>
    </div>`;
  });

  document.getElementById("total").innerText=list.length;

  const today=new Date().toISOString().split("T")[0];
  document.getElementById("today").innerText=list.filter(x=>x.date===today).length;
  document.getElementById("slots").innerText=new Set(list.map(x=>x.slot)).size;
}

window.filterData=function(){
  const q=document.getElementById("search").value.toLowerCase();
  render(data.filter(x=>
    x.name?.toLowerCase().includes(q)||
    x.bigoId?.toLowerCase().includes(q)||
    x.agency?.toLowerCase().includes(q)
  ));
}

window.del=async function(id){
  await deleteDoc(doc(db,"bookings",id));
}

window.exportExcel=function(){
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Bookings");
  XLSX.writeFile(wb,"CN_OPK_ADMIN.xlsx");
}

window.clearAll=async function(){
  const snap=await getDocs(collection(db,"bookings"));
  for(const d of snap.docs){
    await deleteDoc(doc(db,"bookings",d.id));
  }
}

window.logout=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
  if(user){
    load();
  }else{
    alert("Admin Only");
  }
});

</script>

</body>
</html>
