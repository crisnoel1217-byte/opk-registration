<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CN OPK SAAS SYSTEM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}
body{background:#050816;color:white;overflow-x:hidden}

.app{display:flex;min-height:100vh}

.sidebar{
  width:260px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(15px);
  border-right:1px solid rgba(255,255,255,0.08);
  padding:20px;
}

.sidebar h2{font-size:18px;margin-bottom:20px}

.nav-btn{
  width:100%;padding:12px;margin-bottom:10px;
  border-radius:12px;border:none;
  background:rgba(255,255,255,0.06);
  color:white;cursor:pointer;
}

.nav-btn:hover{background:#22d3ee;color:black}

.main{flex:1;padding:20px}

.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  padding:20px;border-radius:18px;margin-bottom:20px
}

input{
  width:100%;padding:12px;margin:8px 0;
  border-radius:10px;border:none;
  background:#0b1020;color:white
}

button{
  padding:10px;border-radius:10px;border:none;
  cursor:pointer;font-weight:700
}

.primary{background:#22d3ee;color:black}
.danger{background:#ef4444;color:white}

.stats{display:flex;gap:10px}
.stat{flex:1;padding:15px;border-radius:12px;background:rgba(34,211,238,0.1)}

.records{display:grid;gap:10px}
.record{padding:15px;border-radius:12px;background:rgba(255,255,255,0.05)}

.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.slot{padding:12px;border-radius:10px;background:rgba(255,255,255,0.06);cursor:pointer;text-align:center}
.slot:hover{background:#22d3ee;color:black}
.selected{border:2px solid #22d3ee}

@media(max-width:900px){.sidebar{display:none}}
</style>
</head>

<body>

<!-- PUBLIC PAGE -->
<div id="publicPage" style="padding:20px">
  <h1>CN OPK BOOKING</h1>

  <div class="card">
    <h3>Book Your Slot</h3>

    <input id="name" placeholder="Name">
    <input id="bigoId" placeholder="Bigo ID">
    <input id="agency" placeholder="Agency">
    <input id="level" placeholder="Level">
    <input id="gmail" placeholder="Gmail">
    <input id="date" type="date">

    <div class="slots" id="slots"></div>

    <button class="primary" onclick="book()">Reserve</button>
  </div>
</div>

<!-- ADMIN PAGE -->
<div class="app" id="adminPage" style="display:none">

<div class="sidebar">
  <h2>ADMIN PANEL</h2>
  <button class="nav-btn">Dashboard</button>
  <button class="nav-btn" onclick="exportExcel()">Export Excel</button>
  <button class="nav-btn danger" onclick="logout()">Logout</button>
</div>

<div class="main">

<div class="card">
<h2>Dashboard</h2>

<div class="stats">
<div class="stat">Total: <span id="total">0</span></div>
<div class="stat">Today: <span id="today">0</span></div>
</div>
</div>

<div class="card">
<input id="search" placeholder="Search..." oninput="filterData()">
<div class="records" id="records"></div>
</div>

</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app = initializeApp({
 apiKey: "AIzaSyBJBT_BAeos1hb_fKJzSontJVgBub9Wjhc",
  authDomain: "opk-system-cn.firebaseapp.com",
  projectId: "opk-system-cn",
  storageBucket: "opk-system-cn.appspot.com",
  messagingSenderId: "1098097772017",
  appId: "1:1098097772017:web:4e015378c786d6b404f050"
});

const db = getFirestore(app);
const auth = getAuth(app);

let selected="";
let data=[];

const slots=["8:00 PM","8:15 PM","8:30 PM","8:45 PM","9:00 PM","9:15 PM"];

const slotsDiv=document.getElementById("slots");

slots.forEach(s=>{
  const d=document.createElement("div");
  d.className="slot";
  d.innerText=s;
  d.onclick=()=>{selected=s;document.querySelectorAll(".slot").forEach(x=>x.classList.remove("selected"));d.classList.add("selected")}
  slotsDiv.appendChild(d);
});

window.book=async()=>{
  await addDoc(collection(db,"bookings"),{
    name:document.getElementById("name").value,
    bigoId:document.getElementById("bigoId").value,
    agency:document.getElementById("agency").value,
    level:document.getElementById("level").value,
    gmail:document.getElementById("gmail").value,
    date:document.getElementById("date").value,
    slot:selected
  });
  alert("Booked Successfully 🎉");
}

function load(){
  onSnapshot(collection(db,"bookings"),(snap)=>{
    data=[];
    document.getElementById("records").innerHTML="";

    snap.forEach(d=>data.push({id:d.id,...d.data()}));

    render(data);
  });
}

function render(list){
  document.getElementById("records").innerHTML="";

  list.forEach(b=>{
    document.getElementById("records").innerHTML+=`
    <div class='record'>
      <b>${b.name}</b><br>${b.slot} | ${b.date}
    </div>`;
  });

  document.getElementById("total").innerText=list.length;

  const t=new Date().toISOString().split("T")[0];
  document.getElementById("today").innerText=list.filter(x=>x.date===t).length;
}

window.filterData=()=>{
  const q=document.getElementById("search").value.toLowerCase();
  render(data.filter(x=>x.name?.toLowerCase().includes(q)||x.bigoId?.toLowerCase().includes(q)||x.agency?.toLowerCase().includes(q)));
}

window.exportExcel=()=>{
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Bookings");
  XLSX.writeFile(wb,"CN_OPK.xlsx");
}

window.logout=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
  if(user){
    document.getElementById("adminPage").style.display="flex";
    document.getElementById("publicPage").style.display="none";
    load();
  } else {
    document.getElementById("adminPage").style.display="none";
    document.getElementById("publicPage").style.display="block";
  }
});

</script>

</body>
</html>
