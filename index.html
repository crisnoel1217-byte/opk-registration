
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CN OPK Pro System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0a12;
  --card:#111827;
  --accent:#7c3aed;
  --accent2:#22d3ee;
  --green:#22c55e;
  --red:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}
body{background:linear-gradient(135deg,#020617,#0a0a12);color:white}
header{
  text-align:center;
  padding:18px;
  font-size:22px;
  font-weight:700;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  color:transparent;
}

.container{max-width:1100px;margin:auto;padding:15px}
.grid{display:grid;gap:15px}
@media(min-width:768px){.grid{grid-template-columns:1fr 1fr}}

.card{
  background:rgba(255,255,255,0.05);
  padding:15px;
  border-radius:14px;
  backdrop-filter:blur(10px);
}

input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

input{background:#020617;color:white}

button{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  font-weight:600;
  cursor:pointer;
}

/* SLOT UI */
.slots-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}
.slot-btn{
  padding:10px;
  border-radius:10px;
  text-align:center;
  font-size:13px;
  background:rgba(255,255,255,0.08);
  transition:.2s;
}
.available{color:var(--green);cursor:pointer}
.taken{color:var(--red);opacity:.5}
.selected{border:1px solid var(--accent2);background:rgba(34,211,238,0.2)}

.admin{display:none}
.error{color:#f87171;font-size:13px;margin-top:6px}

.badge{
  background:var(--accent2);
  color:black;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
}
.stats{display:flex;justify-content:space-between;margin-top:8px}
</style>
</head>

<body>

<header>🔥 CN OPK CLOUD SYSTEM</header>

<div class="container grid">

<!-- BOOKING -->
<div class="card">
<h3>📅 Booking</h3>
<input id="name" placeholder="Bigo Name">
<input id="id" placeholder="Bigo ID">
<input id="lvl" placeholder="Level">
<input id="agency" placeholder="Agency">
<input id="gmail" placeholder="Gmail">
<input id="date" type="date">

<h4 style="margin-top:10px">Select Time</h4>
<div id="slots" class="slots-grid"></div>

<div id="error" class="error"></div>

<button id="bookBtn">Reserve</button>
</div>

<!-- ADMIN LOGIN -->
<div class="card">
<h3>🔐 Admin Login</h3>
<input id="adminEmail" placeholder="Email">
<input id="adminPassword" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<button id="logoutBtn">Logout</button>
</div>

<!-- ADMIN PANEL -->
<div class="card admin" id="adminPanel">
<h3>📊 Dashboard</h3>
<div class="stats"><span>Total</span><span id="total" class="badge">0</span></div>
<div class="stats"><span>Today</span><span id="today" class="badge">0</span></div>
<div id="records"></div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBJBT_BAeos1hb_fKJzSontJVgBub9Wjhc",
  authDomain: "opk-system-cn.firebaseapp.com",
  projectId: "opk-system-cn",
  storageBucket: "opk-system-cn.appspot.com",
  messagingSenderId: "1098097772017",
  appId: "1:1098097772017:web:4e015378c786d6b404f050"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let selectedTime = "";

const els = {
  name: document.getElementById("name"),
  id: document.getElementById("id"),
  lvl: document.getElementById("lvl"),
  agency: document.getElementById("agency"),
  gmail: document.getElementById("gmail"),
  date: document.getElementById("date"),
  slots: document.getElementById("slots"),
  error: document.getElementById("error"),
  bookBtn: document.getElementById("bookBtn"),
  loginBtn: document.getElementById("loginBtn"),
  logoutBtn: document.getElementById("logoutBtn"),
  adminPanel: document.getElementById("adminPanel"),
  records: document.getElementById("records"),
  total: document.getElementById("total"),
  today: document.getElementById("today"),
  adminEmail: document.getElementById("adminEmail"),
  adminPassword: document.getElementById("adminPassword")
};

function generateSlots(){
 let slots=[],h=20,m=0;
 while(h<22||(h===22&&m<=15)){
  slots.push(`${h>12?h-12:h}:${m.toString().padStart(2,'0')} ${h>=12?'PM':'AM'}`);
  m+=15;if(m>=60){m=0;h++}
 }
 return slots;
}

async function fetchBookings(){
 const snap = await getDocs(collection(db,"bookings"));
 return snap.docs.map(d=>d.data());
}

async function render(){
 const date = els.date.value;
 els.slots.innerHTML="";
 selectedTime="";

 if(!date) return;

 const data = await fetchBookings();
 const filtered = data.filter(b=>b.date===date);

 generateSlots().forEach(t=>{
  const taken = filtered.find(b=>b.time===t);
  const btn=document.createElement("div");
  btn.className=`slot-btn ${taken?'taken':'available'}`;
  btn.textContent=t;

  if(!taken){
    btn.onclick=()=>{
      selectedTime=t;
      document.querySelectorAll('.slot-btn').forEach(el=>el.classList.remove('selected'));
      btn.classList.add('selected');
      els.error.textContent="";
    };
  }

  els.slots.appendChild(btn);
 });
}

async function book(){
 const data={
  name: els.name.value.trim(),
  id: els.id.value.trim(),
  lvl: els.lvl.value.trim(),
  agency: els.agency.value.trim(),
  gmail: els.gmail.value.trim(),
  date: els.date.value,
  time: selectedTime
 };

 if(!data.name||!data.id||!data.lvl||!data.agency||!data.gmail){
  els.error.textContent="Fill all fields"; return;
 }

 if(!data.date||!data.time){
  els.error.textContent="Select date & time"; return;
 }

 const existing = await fetchBookings();
 if(existing.find(b=>b.date===data.date && b.time===data.time)){
  els.error.textContent="Slot taken"; return;
 }

 await addDoc(collection(db,"bookings"),data);
 alert("Booked ✅");
 render();
}

async function login(){
 try{
  await signInWithEmailAndPassword(auth, els.adminEmail.value, els.adminPassword.value);
 }catch(e){
  alert("Login failed");
 }
}

function logout(){
 signOut(auth);
}

onAuthStateChanged(auth,(user)=>{
 if(user){
  els.adminPanel.style.display='block';
  loadAdmin();
 }else{
  els.adminPanel.style.display='none';
 }
});

async function loadAdmin(){
 const data = await fetchBookings();
 els.records.innerHTML="";
 els.total.innerText=data.length;

 const today=new Date().toISOString().split('T')[0];
 els.today.innerText=data.filter(b=>b.date===today).length;

 data.forEach(b=>{
  const div=document.createElement("div");
  div.className="slot-btn";
  div.innerHTML=`${b.name} | ${b.time} | ${b.date}`;
  els.records.appendChild(div);
 });
}

els.date.addEventListener("change",render);
els.bookBtn.addEventListener("click",book);
els.loginBtn.addEventListener("click",login);
els.logoutBtn.addEventListener("click",logout);

</script>

</body>
</html>
