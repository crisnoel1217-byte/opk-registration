<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBJBT_BAeos1hb_fKJzSontJVgBub9Wjhc",
  authDomain: "opk-system-cn.firebaseapp.com",
  projectId: "opk-system-cn",
  storageBucket: "opk-system-cn.appspot.com",
  messagingSenderId: "1098097772017",
  appId: "1:1098097772017:web:4e015378c786d6b404f050"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* ELEMENTS */
const slots = document.getElementById("slots");
const adminPanel = document.getElementById("adminPanel");
const records = document.getElementById("records");
const total = document.getElementById("total");
const today = document.getElementById("today");

const bookBtn = document.getElementById("bookBtn");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");

const adminEmail = document.getElementById("adminEmail");
const adminPassword = document.getElementById("adminPassword");

let selectedTime = "";

/* TIME SLOTS */
function generateSlots() {
  let s = [];
  let h = 20;
  let m = 0;

  while (h < 22 || (h === 22 && m <= 15)) {
    let hour = h > 12 ? h - 12 : h;
    let minute = m.toString().padStart(2, "0");
    let ampm = h >= 12 ? "PM" : "AM";

    s.push(`${hour}:${minute} ${ampm}`);

    m += 15;

    if (m >= 60) {
      m = 0;
      h++;
    }
  }

  return s;
}

/* RENDER SLOTS */
function renderSlots() {
  slots.innerHTML = "";

  generateSlots().forEach((t) => {
    const div = document.createElement("div");

    div.className = "slot-btn available";
    div.textContent = t;

    div.onclick = () => {
      document.querySelectorAll(".slot-btn").forEach((x) => {
        x.classList.remove("selected");
      });

      div.classList.add("selected");
      selectedTime = t;
    };

    slots.appendChild(div);
  });
}

/* BOOKING */
async function book() {
  const name = document.getElementById("name").value.trim();
  const id = document.getElementById("id").value.trim();
  const lvl = document.getElementById("lvl").value.trim();
  const agency = document.getElementById("agency").value.trim();
  const gmail = document.getElementById("gmail").value.trim();
  const date = document.getElementById("date").value;

  if (!name || !id || !lvl || !agency || !gmail || !date) {
    alert("❌ Complete all fields");
    return;
  }

  if (!selectedTime) {
    alert("❌ Select a time slot");
    return;
  }

  try {
    await addDoc(collection(db, "bookings"), {
      name,
      id,
      lvl,
      agency,
      gmail,
      date,
      time: selectedTime,
      createdAt: new Date()
    });

    alert("✅ Booking Successful");

    location.reload();

  } catch (e) {
    console.error(e);
    alert("❌ Booking Failed");
  }
}

/* LOGIN */
async function login() {
  const email = adminEmail.value.trim();
  const password = adminPassword.value.trim();

  if (!email || !password) {
    alert("❌ Enter admin email & password");
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, password);
    alert("✅ Login Success");

  } catch (e) {
    console.error(e);
    alert("❌ Login Failed");
  }
}

/* LOGOUT */
async function logout() {
  await signOut(auth);
  alert("Logged out");
}

/* BUTTON EVENTS */
bookBtn.addEventListener("click", book);
loginBtn.addEventListener("click", login);
logoutBtn.addEventListener("click", logout);

/* ADMIN PANEL */
onAuthStateChanged(auth, async (user) => {

  if (user) {

    adminPanel.style.display = "block";

    const snap = await getDocs(collection(db, "bookings"));

    records.innerHTML = "";

    let todayCount = 0;
    const todayDate = new Date().toISOString().split("T")[0];

    snap.forEach((doc) => {

      const b = doc.data();

      if (b.date === todayDate) {
        todayCount++;
      }

      records.innerHTML += `
        <div class="slot-btn">
          ${b.name} | ${b.time} | ${b.date}
        </div>
      `;
    });

    total.innerText = snap.size;
    today.innerText = todayCount;

  } else {

    adminPanel.style.display = "none";
  }
});

/* START */
renderSlots();
</script>
