
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CN OPK MANAGEMENT SYSTEM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0a12;
  --card:#111827;
  --accent:#7c3aed;
  --accent2:#22d3ee;
  --green:#22c55e;
  --red:#ef4444;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}
body{background:linear-gradient(135deg,#020617,#0a0a12);color:white}

header{
  text-align:center;
  padding:18px;
  font-size:22px;
  font-weight:700;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  color:transparent;
}

.container{max-width:1200px;margin:auto;padding:15px}
.grid{display:grid;gap:15px}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}

.card{
  background:rgba(255,255,255,0.05);
  padding:15px;
  border-radius:14px;
  backdrop-filter:blur(10px);
}

input,button,select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

input,select{background:#020617;color:white}

button{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  font-weight:600;
  cursor:pointer;
}

/* ⭐ IMPROVED SLOT UI */
.slots{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:12px;
}

.slot{
  padding:14px;
  border-radius:14px;
  text-align:center;
  font-size:13px;
  font-weight:600;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  cursor:pointer;
  transition:all .2s ease;
  user-select:none;
  position:relative;
  overflow:hidden;
}

.slot:hover{
  transform:translateY(-2px);
  background:rgba(34,211,238,0.10);
  border:1px solid rgba(34,211,238,0.4);
}

.slot:active{
  transform:scale(0.97);
}

.selected{
  border:2px solid var(--accent2);
  background:rgba(34,211,238,0.18);
  box-shadow:0 0 12px rgba(34,211,238,0.3);
}

#confirmPage{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.9);
  z-index:999;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.confirmBox{
  background:rgba(255,255,255,0.08);
  padding:20px;
  border-radius:15px;
  max-width:320px;
}

.error{
  color:#ef4444;
  font-size:12px;
  margin-top:10px;
}

.admin{display:none}

/* footer */
.footer{
  margin-top:20px;
  text-align:center;
  padding:15px;
  font-size:13px;
  opacity:0.9;
  background:rgba(255,255,255,0.05);
  border-radius:12px;
}
</style>
</head>

<body>

<header>🔥 CN OPK MANAGEMENT SYSTEM</header>

<div class="container grid">

<div class="card">
<h3>📅 Book OPK</h3>

<input id="name" placeholder="Bigo Name">
<input id="bid" placeholder="Bigo ID">
<input id="lvl" placeholder="Level">
<input id="agency" placeholder="Agency">
<input id="gmail" placeholder="Gmail">
<input id="date" type="date">

<h4 style="margin-top:10px">Select Time</h4>
<div id="slots" class="slots"></div>

<button onclick="book()">Reserve OPK</button>

<div id="err" class="error"></div>
</div>

<div class="card">
<h3>🔐 Admin Login</h3>
<input id="adminPass" type="password" placeholder="Enter Password">
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>
</div>

<div class="card admin" id="adminPanel">
<h3>📊 Dashboard</h3>
<div id="list"></div>
</div>

</div>

<div id="confirmPage">
  <div class="confirmBox">
    <h2>🎉 Booking Confirmed</h2>
    <p>We have received your booking. THANK YOU</p>
    <button onclick="closeConfirm()">Close</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig={
  apiKey:"YOUR_API_KEY",
  authDomain:"YOUR_AUTH_DOMAIN",
  projectId:"YOUR_PROJECT_ID"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

let selected="";

signInAnonymously(auth).catch(console.error);

function slotsGen(){
 let s=[],h=20,m=0;
 while(h<22||(h===22&&m<=15)){
  s.push(`${h>12?h-12:h}:${m.toString().padStart(2,'0')} ${h>=12?'PM':'AM'}`);
  m+=15;if(m>=60){m=0;h++}
 }
 return s;
}

function renderSlots(){
 let box=document.getElementById("slots");
 box.innerHTML="";

 slotsGen().forEach(t=>{
  let d=document.createElement("div");
  d.className="slot";
  d.textContent=t;

  d.onclick=()=>{
    document.querySelectorAll(".slot").forEach(x=>x.classList.remove("selected"));
    d.classList.add("selected");
    selected=t;
  };

  box.appendChild(d);
 });
}

window.book=async function(){
 try{
  if(!selected){document.getElementById("err").innerText="Select time first";return;}

  await addDoc(collection(db,"opk"),{
    name:document.getElementById("name").value||"",
    bid:document.getElementById("bid").value||"",
    lvl:document.getElementById("lvl").value||"",
    agency:document.getElementById("agency").value||"",
    gmail:document.getElementById("gmail").value||"",
    date:document.getElementById("date").value||"",
    time:selected
  });

  alert("✅ Booking received. THANK YOU");
  showConfirm();

 }catch(e){
  console.error(e);
  document.getElementById("err").innerText="Firebase error / permission issue";
 }
}

window.login=function(){
 const pass=document.getElementById("adminPass").value;
 if(pass==="TRD123"){
  document.getElementById("adminPanel").style.display="block";
  load();
 }else alert("Wrong password");
}

window.logout=function(){
 document.getElementById("adminPanel").style.display="none";
}

async function load(){
 const snap=await getDocs(collection(db,"opk"));
 let box=document.getElementById("list");
 box.innerHTML="";

 snap.forEach(d=>{
  let b=d.data();
  let div=document.createElement("div");
  div.style.padding="10px";
  div.style.marginTop="10px";
  div.style.background="rgba(255,255,255,0.06)";
  div.style.borderRadius="10px";
  div.innerHTML=`<b>${b.name||"N/A"}</b><br>${b.time||""} | ${b.date||""}`;
  box.appendChild(div);
 });
}

window.showConfirm=()=>document.getElementById("confirmPage").style.display="flex";
window.closeConfirm=()=>document.getElementById("confirmPage").style.display="none";

renderSlots();
</script>

<!-- CONTACT -->
<div class="footer">
  <h4>📩 For Inquiries</h4>
  <p>📞 09911530204</p>
  <p>📧 CRISNOEL1217@GMAIL.COM</p>
  <p>🎯 BIGO ID: TRD10_28</p>
</div>

</body>
</html>
