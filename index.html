
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CN OPK MANAGEMENT SYSTEM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0a0a12;
  --card:#111827;
  --accent:#7c3aed;
  --accent2:#22d3ee;
  --green:#22c55e;
  --red:#ef4444;
  --yellow:#fbbf24;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}
body{background:linear-gradient(135deg,#020617,#0a0a12);color:white}

header{
  text-align:center;
  padding:18px;
  font-size:22px;
  font-weight:700;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  color:transparent;
}

.container{max-width:1200px;margin:auto;padding:15px}
.grid{display:grid;gap:15px}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}

.card{
  background:rgba(255,255,255,0.05);
  padding:15px;
  border-radius:14px;
  backdrop-filter:blur(10px);
}

input,button,select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

input,select{background:#020617;color:white}

button{
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  font-weight:600;
  cursor:pointer;
}

.slots{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

.slot{
  padding:10px;
  border-radius:10px;
  text-align:center;
  font-size:12px;
  background:rgba(255,255,255,0.08);
  cursor:pointer;
  transition:0.2s;
}

.slot:hover{
  transform:scale(1.03);
}

.available{color:var(--green)}
.selected{border:2px solid var(--accent2); background:rgba(34,211,238,0.15)}

.badge{padding:4px 10px;border-radius:999px;font-size:12px}

.pending{background:var(--yellow);color:black}
.approved{background:var(--green);color:black}
.cancelled{background:var(--red);color:white}

.item{
  background:rgba(255,255,255,0.06);
  padding:10px;
  margin-top:10px;
  border-radius:10px;
}

.smallBtn{
  margin-top:5px;
  padding:6px;
  font-size:12px;
}

.admin{display:none}

.summary{margin-top:10px;background:rgba(255,255,255,0.06);padding:10px;border-radius:10px}

/* CONFIRM PAGE */
#confirmPage{
  display:none;
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.9);
  z-index:999;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.confirmBox{
  background:rgba(255,255,255,0.08);
  padding:20px;
  border-radius:15px;
  max-width:320px;
}
</style>
</head>

<body>

<header> CN OPK MANAGEMENT SYSTEM</header>

<div class="container grid">

<!-- BOOKING -->
<div class="card">
<h3>📅 Book OPK</h3>

<input id="name" placeholder="Bigo Name">
<input id="bid" placeholder="Bigo ID">
<input id="lvl" placeholder="Level">
<input id="agency" placeholder="Agency">
<input id="gmail" placeholder="Gmail">
<input id="date" type="date">

<h4 style="margin-top:10px">Select Time</h4>
<div id="slots" class="slots"></div>

<button onclick="book()">Reserve OPK</button>
</div>

<!-- ADMIN -->
<div class="card">
<h3>🔐 Admin</h3>
<input id="adminEmail" placeholder="Email">
<input id="adminPassword" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>

<input id="search" placeholder="Search">
<button onclick="search()">Search</button>

<div class="summary">
<h4>📊 Summary</h4>
<div id="summaryBox"></div>
</div>
</div>

<div class="card admin" id="adminPanel">
<h3>📊 Dashboard</h3>
<div id="list"></div>
</div>

</div>

<!-- CONFIRM PAGE -->
<div id="confirmPage">
  <div class="confirmBox">
    <h2>🎉 Booking Confirmed</h2>
    <p>We have received your booking. THANK YOU</p>
    <button onclick="closeConfirm()">Close</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig={
apiKey: "AIzaSyBJBT_BAeos1hb_fKJzSontJVgBub9Wjhc",
 authDomain: "opk-system-cn.firebaseapp.com",
 projectId: "opk-system-cn",
 storageBucket: "opk-system-cn.appspot.com",
 messagingSenderId: "1098097772017",
 appId: "1:1098097772017:web:4e015378c786d6b404f050"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

let all=[];
let selected="";

function slotsGen(){
 let s=[],h=20,m=0;
 while(h<22||(h===22&&m<=15)){
  s.push(`${h>12?h-12:h}:${m.toString().padStart(2,'0')} ${h>=12?'PM':'AM'}`);
  m+=15;if(m>=60){m=0;h++}
 }
 return s;
}

function renderSlots(){
 let box=document.getElementById("slots");
 box.innerHTML="";

 slotsGen().forEach(t=>{
  let d=document.createElement("div");
  d.className="slot available";
  d.textContent=t;

  d.onclick=()=>{
    document.querySelectorAll(".slot").forEach(x=>x.classList.remove("selected"));
    d.classList.add("selected");
    selected=t;
  };

  box.appendChild(d);
 });
}

window.book=async function(){

 if(!selected){alert("Please select time");return;}

 await addDoc(collection(db,"opk"),{
  name:name.value,
  bid:bid.value,
  lvl:lvl.value,
  agency:agency.value,
  gmail:gmail.value,
  date:date.value,
  time:selected,
  status:"pending"
 });

 alert("✅ We have received your booking. THANK YOU");
 showConfirm();
 load();
}

window.showConfirm=function(){
 document.getElementById("confirmPage").style.display="flex";
}

window.closeConfirm=function(){
 document.getElementById("confirmPage").style.display="none";
}

renderSlots();
</script>

</div>
</body>
</html>
